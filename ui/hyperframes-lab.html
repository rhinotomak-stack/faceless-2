<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperFrames Motion Lab</title>
    <style>
        :root {
            --bg: #070a10;
            --panel: #0e131d;
            --panel-2: #121927;
            --line: #243044;
            --text: #f2f6ff;
            --muted: #8b98ad;
            --blue: #58a6ff;
            --cyan: #21d4fd;
            --green: #4ade80;
            --yellow: #facc15;
            --red: #fb7185;
            --violet: #8b5cf6;
            --orange: #fb923c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Segoe UI, Arial, sans-serif;
            overflow: hidden;
        }
        button, select, input {
            font: inherit;
            color: var(--text);
        }
        button {
            border: 1px solid var(--line);
            background: #172033;
            border-radius: 7px;
            padding: 9px 12px;
            cursor: pointer;
        }
        button:hover { border-color: var(--blue); background: #1b2a43; }
        button.primary { background: linear-gradient(135deg, #2f6df6, #12b5cb); border-color: transparent; font-weight: 700; }
        button.ghost { background: transparent; }
        button:disabled { opacity: 0.55; cursor: wait; }
        select, input {
            width: 100%;
            border: 1px solid var(--line);
            background: #0b1020;
            border-radius: 7px;
            padding: 8px 10px;
            outline: none;
        }
        input[type="checkbox"] {
            width: auto;
            accent-color: var(--blue);
        }
        input[type="number"] { appearance: textfield; }
        .app {
            height: 100vh;
            display: grid;
            grid-template-rows: 64px 1fr;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #182030;
            background: #0a0d14;
        }
        .brand {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .brand h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 0;
        }
        .brand span {
            color: var(--muted);
            font-size: 13px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .status-pill {
            border: 1px solid var(--line);
            background: #101727;
            border-radius: 999px;
            padding: 7px 11px;
            color: var(--muted);
            font-size: 12px;
            min-width: 128px;
            text-align: center;
        }
        .status-pill.ok { color: var(--green); border-color: rgba(74, 222, 128, 0.45); }
        .status-pill.warn { color: var(--yellow); border-color: rgba(250, 204, 21, 0.45); }
        .status-pill.err { color: var(--red); border-color: rgba(251, 113, 133, 0.45); }
        main {
            min-height: 0;
            display: grid;
            grid-template-columns: 330px minmax(540px, 1fr) 410px;
        }
        aside, section {
            min-height: 0;
            overflow: auto;
        }
        .left, .right {
            border-right: 1px solid #182030;
            background: #090d15;
            padding: 16px;
        }
        .right { border-left: 1px solid #182030; border-right: 0; }
        .center {
            display: grid;
            grid-template-rows: minmax(360px, 1fr) 260px;
            min-width: 0;
            background: radial-gradient(circle at 50% 10%, #101b2d 0, #070a10 44%);
        }
        .preview-shell {
            min-height: 0;
            padding: 18px;
            display: grid;
            grid-template-rows: 1fr auto;
            gap: 12px;
        }
        .preview-frame-wrap {
            min-height: 280px;
            border: 1px solid #1d2a3d;
            background: #020409;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #020409;
        }
        .empty-preview {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--muted);
            text-align: center;
            padding: 20px;
        }
        .project-path {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preview-controls {
            display: grid;
            grid-template-columns: auto auto minmax(120px, 1fr) auto;
            gap: 10px;
            align-items: center;
        }
        .preview-controls button {
            min-width: 74px;
            padding: 8px 10px;
        }
        .preview-controls input[type="range"] {
            padding: 0;
            accent-color: var(--blue);
        }
        .preview-time {
            min-width: 86px;
            text-align: right;
            color: var(--muted);
            font-family: Consolas, monospace;
            font-size: 12px;
        }
        .panel {
            border: 1px solid #1c2638;
            background: var(--panel);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .panel h2, .panel h3 {
            margin: 0 0 12px;
            font-size: 14px;
        }
        .panel h2 { font-size: 16px; }
        .field {
            margin-bottom: 12px;
        }
        .field label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .checkline {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            border: 1px solid #1e2b40;
            background: #0b1020;
            border-radius: 7px;
            padding: 10px;
        }
        .checkline strong {
            display: block;
            font-size: 13px;
        }
        .checkline span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
            margin-top: 3px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .actions .wide { grid-column: 1 / -1; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .metric {
            border: 1px solid #1c2638;
            border-radius: 8px;
            padding: 11px;
            background: var(--panel-2);
            min-height: 72px;
        }
        .metric .label {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .metric .value {
            margin-top: 6px;
            font-size: 20px;
            font-weight: 800;
        }
        .metric .hint {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }
        .report-zone {
            border-top: 1px solid #182030;
            background: #090d15;
            min-height: 0;
            overflow: auto;
            padding: 14px 18px;
        }
        .report-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }
        .report-card {
            border: 1px solid #1c2638;
            background: var(--panel);
            border-radius: 8px;
            padding: 12px;
            min-height: 86px;
        }
        .report-card b {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .report-card span {
            font-size: 15px;
            font-weight: 700;
        }
        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .scroll-box {
            max-height: 190px;
            overflow: auto;
            border: 1px solid #1c2638;
            background: #070b12;
            border-radius: 8px;
            padding: 10px;
        }
        .issue {
            border-left: 3px solid var(--yellow);
            padding: 8px 10px;
            margin-bottom: 8px;
            background: rgba(250, 204, 21, .08);
            color: #fef3c7;
            font-size: 12px;
        }
        .issue.err {
            border-color: var(--red);
            background: rgba(251, 113, 133, .08);
            color: #fecdd3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            padding: 8px 9px;
            border-bottom: 1px solid #182030;
            text-align: left;
            vertical-align: top;
        }
        th { color: var(--muted); font-weight: 600; }
        td code {
            color: #b9d9ff;
            font-family: Consolas, monospace;
            font-size: 11px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 3px 8px;
            background: #172033;
            color: #b9d9ff;
            font-size: 11px;
            margin: 0 4px 4px 0;
        }
        .badge.good { color: var(--green); background: rgba(74, 222, 128, .1); }
        .badge.warn { color: var(--yellow); background: rgba(250, 204, 21, .1); }
        .badge.hot { color: #fecdd3; background: rgba(251, 113, 133, .1); }
        .log {
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #b7c5d8;
            white-space: pre-wrap;
            min-height: 74px;
        }
        @media (max-width: 1240px) {
            main { grid-template-columns: 300px 1fr; }
            .right { display: none; }
            .report-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="brand">
                <h1>HyperFrames Motion Lab</h1>
                <span>real bridge coverage for MGs, templates, styles, animation, and media</span>
            </div>
            <div class="header-actions">
                <div id="status-pill" class="status-pill">Loading registry</div>
                <button id="btn-refresh-registry" class="ghost">Refresh Registry</button>
                <button id="btn-open-folder" class="ghost">Open Output</button>
            </div>
        </header>

        <main>
            <aside class="left">
                <div class="panel">
                    <h2>Test Run</h2>
                    <div class="field">
                        <label for="mode">Coverage</label>
                        <select id="mode">
                            <option value="single">Selected Item</option>
                            <option value="mg-all">All Motion Graphics</option>
                            <option value="template-all">All Templates</option>
                            <option value="all">Full Matrix</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="kind">Kind</label>
                            <select id="kind">
                                <option value="mg">Motion Graphic</option>
                                <option value="template">Template</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="theme-select">Theme</label>
                            <select id="theme-select"></select>
                        </div>
                    </div>
                    <div class="field">
                        <label for="type-select">Type</label>
                        <select id="type-select"></select>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="variant-select">Variant</label>
                            <select id="variant-select"></select>
                        </div>
                        <div class="field">
                            <label for="animation-select">Animation</label>
                            <select id="animation-select"></select>
                        </div>
                    </div>
                    <div class="field">
                        <label for="style-select">Style</label>
                        <select id="style-select"></select>
                    </div>
                    <div class="field">
                        <label class="checkline" for="motion-director">
                            <input id="motion-director" type="checkbox" checked>
                            <span>
                                <strong>Motion Director</strong>
                                <span>Use the same AI composition pass as the real build.</span>
                            </span>
                        </label>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="duration">Item Seconds</label>
                            <input id="duration" type="number" min="1.6" max="8" step="0.1" value="2.8">
                        </div>
                        <div class="field">
                            <label for="gap">Gap Seconds</label>
                            <input id="gap" type="number" min="0.15" max="1.5" step="0.05" value="0.35">
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="speed">Animation Speed</label>
                            <input id="speed" type="number" min="0.25" max="2.5" step="0.05" value="1">
                        </div>
                        <div class="field">
                            <label for="shadow">Shadow</label>
                            <input id="shadow" type="number" min="0" max="1" step="0.05" value="0.55">
                        </div>
                    </div>
                    <div class="actions">
                        <button id="btn-generate" class="primary">Generate Test</button>
                        <button id="btn-generate-all">Full Matrix</button>
                    </div>
                </div>

                <div class="panel">
                    <h2>Registry</h2>
                    <div id="coverage-summary" class="metrics"></div>
                </div>

                <div class="panel">
                    <h2>Styles</h2>
                    <div id="style-badges"></div>
                </div>
            </aside>

            <section class="center">
                <div class="preview-shell">
                    <div class="preview-frame-wrap">
                        <div id="empty-preview" class="empty-preview">Generate a test to load a real HyperFrames preview project.</div>
                        <iframe id="preview-frame" allow="autoplay; fullscreen"></iframe>
                    </div>
                    <div class="preview-controls">
                        <button id="btn-preview-play" disabled>Play</button>
                        <button id="btn-preview-restart" disabled>Restart</button>
                        <input id="preview-scrub" type="range" min="0" max="1000" step="1" value="0" disabled>
                        <div id="preview-time" class="preview-time">0.00 / 0.00</div>
                    </div>
                    <div id="project-path" class="project-path">No project generated yet.</div>
                </div>

                <div class="report-zone">
                    <div id="report-summary" class="report-grid"></div>
                    <div class="split">
                        <div>
                            <h3>Issues</h3>
                            <div id="issue-list" class="scroll-box"></div>
                        </div>
                        <div>
                            <h3>Run Log</h3>
                            <div id="log" class="scroll-box log"></div>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="right">
                <div class="panel">
                    <h2>Resolved Output</h2>
                    <div id="resolved-table" class="scroll-box" style="max-height: 360px;"></div>
                </div>
                <div class="panel">
                    <h2>Coverage Matrix</h2>
                    <div id="matrix-grid" class="scroll-box" style="max-height: 360px;"></div>
                </div>
            </aside>
        </main>
    </div>
    <script src="js/hyperframes-lab.js"></script>
</body>
</html>
