name: Verify

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run verify:ci
      - run: npm run verify:runtime-security
      - run: npm run verify:runtime-project-store
